server:
  port: 8000

spring:
  application:
    name: agent-crawler-api

agent:
  handler: langchain
  text-chunk-max-chars: 512
  crawler:
    max-search-results: 3
    max-episodes-per-road: 5
    request-timeout-seconds: 20
  llm:
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}
    model: ${DEEPSEEK_MODEL:deepseek-chat}
    memory-max-messages: 10
