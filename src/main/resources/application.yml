server:
  port: 8000

spring:
  application:
    name: agent-crawler-api
  servlet:
    multipart:
      max-file-size: 32MB
      max-request-size: 48MB
  mvc:
    async:
      request-timeout: 180000

agent:
  handler: langchain
  text-chunk-max-chars: 512
  crawler:
    max-search-results: 3
    max-episodes-per-road: 5
    request-timeout-seconds: 20
    webview:
      enabled: true
      headless: true
      navigation-timeout-seconds: 25
      settle-timeout-seconds: 8
    reliability:
      enabled: true
      failure-window-seconds: 60
      min-samples: 5
      open-after-failures: 5
      failure-rate-threshold: 0.5
      open-wait-seconds: 180
      probe-interval-seconds: 30
      playwright-max-concurrent: 2
    cache:
      enabled: true
      play-ttl-seconds: 600
      catalog-ttl-seconds: 28800
      key-prefix: acrawl
      redis:
        enabled: ${AGENT_REDIS_ENABLED:false}
        host: ${AGENT_REDIS_HOST:127.0.0.1}
        port: ${AGENT_REDIS_PORT:6379}
        database: ${AGENT_REDIS_DB:0}
        password: ${AGENT_REDIS_PASSWORD:}
        timeout-ms: 2000
    fallback:
      enabled: true
      yhdm:
        enabled: true
        base-url: ${AGENT_YHDM_BASE_URL:http://www.iyinghua.io}
        play-url-template: ${AGENT_YHDM_PLAY_URL:https://tup.iyinghua.com/?vid=%s}
      silisili:
        enabled: true
        base-url: ${AGENT_SILISILI_BASE_URL:https://www.silisili.link}
        cookie: ${AGENT_SILISILI_COOKIE:silisili=on}
  session:
    enabled: true
    ttl-seconds: 604800
    key-prefix: asess
  llm:
    # main 启动时 EnvFileLoader 会从 .env 写入 DEEPSEEK_API_KEY / agent.llm.api-key
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}
    model: ${DEEPSEEK_MODEL:deepseek-chat}
    memory-max-messages: 4
  vision:
    model: ${DEEPSEEK_VISION_MODEL:deepseek-v4-flash-vision-exp}
    detail: ${DEEPSEEK_VISION_DETAIL:original}
    min-confidence-to-lock: 0.7
  upload:
    storage-dir: ${AGENT_UPLOAD_DIR:./data/uploads}
    public-base-url: ${AGENT_PUBLIC_BASE_URL:http://localhost:8000}
    max-size-bytes: 33554432
  link:
    timeout-seconds: 5
    max-links-per-message: 3
    min-confidence-to-lock: 0.65
    allow-private-hosts: false
