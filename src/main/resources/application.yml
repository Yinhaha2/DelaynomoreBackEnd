server:
  port: 8000

spring:
  application:
    name: agent-crawler-api

agent:
  handler: langchain
  text-chunk-max-chars: 512
  crawler:
    max-search-results: 3
    max-episodes-per-road: 5
    request-timeout-seconds: 20
  openai:
    api-key: ${OPENAI_API_KEY:}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    model: ${OPENAI_MODEL:gpt-4o-mini}
