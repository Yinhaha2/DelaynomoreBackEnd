agent:
  handler: langchain
  text-chunk-max-chars: 512
  crawler:
    max-search-results: 3
    max-episodes-per-road: 5
    request-timeout-seconds: 5
    webview:
      enabled: false
      headless: true
      navigation-timeout-seconds: 8
      settle-timeout-seconds: 2
    reliability:
      enabled: false
    cache:
      enabled: true
      redis:
        enabled: false
    fallback:
      enabled: false
      yhdm:
        enabled: false
        base-url: http://127.0.0.1
        play-url-template: http://127.0.0.1/?vid=%s
      silisili:
        enabled: false
        base-url: http://127.0.0.1
        cookie: ""
  session:
    enabled: true
    ttl-seconds: 604800
    key-prefix: asess
  llm:
    api-key: ""
    memory-max-messages: 4
  vision:
    model: deepseek-v4-flash-vision-exp
    detail: original
    min-confidence-to-lock: 0.7
  upload:
    storage-dir: ./target/test-uploads
    public-base-url: http://localhost:8000
    max-size-bytes: 33554432
  link:
    timeout-seconds: 3
    max-links-per-message: 3
    min-confidence-to-lock: 0.65
    allow-private-hosts: true
